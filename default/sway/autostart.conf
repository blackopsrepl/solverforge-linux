# SolverForge — Autostart applications

# Tray infrastructure for Waybar status icons
exec_always sh -lc 'exec "${SOLVERFORGE_PATH:-$HOME/.local/share/solverforge}/bin/solverforge-tray-start"'

# Waybar (restart on sway reload)
exec_always sh -lc 'exec "${SOLVERFORGE_PATH:-$HOME/.local/share/solverforge}/bin/solverforge-waybar-start"'

# Waybar companion daemons (restart if a boot-time refresh failure exits early)
exec_always sh -lc 'exec "${SOLVERFORGE_PATH:-$HOME/.local/share/solverforge}/bin/solverforge-waybar-companions-start"'



# Logitech device manager (tray hidden)
exec_always sh -lc '"${SOLVERFORGE_PATH:-$HOME/.local/share/solverforge}/bin/solverforge-wait-statusnotifier" || true; pkill -x solaar 2>/dev/null || true; sleep 0.2; exec solaar -w hide'

# Screen annotation overlay daemon
exec_always sh -lc '"${SOLVERFORGE_PATH:-$HOME/.local/share/solverforge}/bin/solverforge-wait-statusnotifier" || true; pkill -x wayscriber 2>/dev/null || true; sleep 0.2; exec wayscriber --daemon'

# Autotiling daemon (dwindle-style split direction)
exec_always pkill -x solverforge-autotile; sleep 0.2; solverforge-autotile

# Idle manager: SolverForge screensaver + lock flow
exec_always pkill -x swayidle; sleep 0.2; solverforge-swayidle

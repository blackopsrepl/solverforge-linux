# SolverForge — Sway keybinding overrides
# Reshuffles default bindings + unified copy/paste + menu system

# --- Unbind keys we're reassigning ---
unbindsym $mod+d
unbindsym $mod+space
unbindsym $mod+v
unbindsym $mod+b
unbindsym $mod+minus
unbindsym $mod+Shift+minus
unbindsym $mod+s
unbindsym $mod+w
unbindsym $mod+e
unbindsym $mod+k

# --- Remove vim-style hjkl navigation (arrows are equivalent and preferred) ---
unbindsym $mod+h
unbindsym $mod+j
unbindsym $mod+l
unbindsym $mod+Shift+h
unbindsym $mod+Shift+j
unbindsym $mod+Shift+k
unbindsym $mod+Shift+l

# --- Launcher / Focus ---
bindsym $mod+space exec $menu
bindsym $mod+d focus mode_toggle

# --- Unified copy/paste ---
# Sends Ctrl+Insert / Shift+Insert via wtype — works in both
# terminals and GUI apps without conflicting with Ctrl+C (SIGINT)
bindsym $mod+c exec wtype -M ctrl -k Insert -m ctrl
bindsym $mod+v exec wtype -M shift -k Insert -m shift
bindsym $mod+x exec wtype -M ctrl -k x -m ctrl

# --- Splits (relocated) ---
bindsym $mod+backslash splith
bindsym $mod+minus splitv

# --- Scratchpad (relocated from $mod+minus / $mod+Shift+minus) ---
bindsym $mod+s scratchpad show
bindsym $mod+Shift+s move scratchpad

# --- Layouts ---
bindsym $mod+w layout tabbed
bindsym $mod+Shift+w layout stacking
bindsym $mod+e layout toggle split

# --- Menu system ---
bindsym $mod+Mod1+space exec solverforge-menu
bindsym $mod+Escape exec solverforge-menu system
bindsym $mod+k exec solverforge-keys --dmenu

# --- Keybinding guide in terminal ---
bindsym $mod+Shift+slash exec $term -e solverforge-keys

# --- Keyboard layout cycling ---
bindsym Mod4+Mod1+k input "type:keyboard" xkb_switch_layout next

# --- Wayscriber screen annotation toggle ---
bindsym $mod+g exec pkill -SIGUSR1 wayscriber

# --- Keystroke overlay toggle (for screen recordings / OBS) ---
bindsym $mod+Shift+k exec solverforge-showkeys

# --- Applications ---
bindsym $mod+Shift+b exec $browser
bindsym $mod+Shift+m exec emacsclient --create-frame
